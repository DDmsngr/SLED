name: sled
description: SLED - GPS tracker with photo markers.
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  equatable: ^2.0.5

  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  image_picker: ^1.1.2
  image: ^4.2.0
  gal: ^1.2.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  path: ^1.9.0

  hive_flutter: ^1.1.0
  hive: ^2.2.3

  go_router: ^14.2.7
  flutter_foreground_task: ^8.6.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  gap: ^3.0.1

  intl: ^0.19.0
  uuid: ^4.4.2
  logger: ^2.4.0

  # GPX-парсинг
  xml: ^6.5.0

  # Импорт GPX
  file_picker: ^8.0.0

  # Нативный splash screen
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
