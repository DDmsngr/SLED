name: sled
description: SLED - GPS tracker with photo markers and offline maps.
version: 1.2.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  equatable: ^2.0.5

  yandex_mapkit: ^4.2.1
  latlong2: ^0.9.1

  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  image_picker: ^1.1.2
  image: ^4.2.0
  gal: ^1.2.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # База данных (Isar — заменяет Hive)
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0  # нативные бинари для Android/iOS

  go_router: ^14.2.7
  flutter_foreground_task: ^8.6.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  gap: ^3.0.1

  intl: ^0.19.0
  uuid: ^4.4.2
  logger: ^2.4.0
  # GPX-парсинг
  xml: ^6.5.0

  # Импорт GPX
  file_picker: ^8.0.0

  # Нативный splash screen
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_generator: ^3.1.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/sled_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/sled_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
