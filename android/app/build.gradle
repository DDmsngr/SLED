plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'
def yandexMapkitApiKey = System.getenv('YANDEX_MAPKIT_API_KEY') ?:
    localProperties.getProperty('yandexMapkitApiKey') ?: 'test_api_key'
def keyPrefix = yandexMapkitApiKey.length() > 8 ? yandexMapkitApiKey[0..7] : yandexMapkitApiKey
logger.lifecycle(">>> SLED: yandexMapkitApiKey prefix = ${keyPrefix}...")

android {
    namespace "com.example.sled"
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.example.sled"
        minSdk 24
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
        manifestPlaceholders["yandexMapkitApiKey"] = yandexMapkitApiKey
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    signingConfigs {
        release {
            // TODO: укажите реальный keystore перед публикацией
            // storeFile file("sled.keystore")
            // storePassword "..."
            // keyAlias "sled"
            // keyPassword "..."
            // Пока используем debug-подпись для тестирования
            storeFile file(localProperties.getProperty('debug.store.file') ?:
                "${System.getenv('HOME')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }
}

flutter { source "../.." }

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
}
