plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'
def yandexMapkitApiKey = System.getenv('YANDEX_MAPKIT_API_KEY') ?:
    localProperties.getProperty('yandexMapkitApiKey') ?: 'test_api_key'
def keyPrefix = yandexMapkitApiKey.length() > 8 ? yandexMapkitApiKey[0..7] : yandexMapkitApiKey
logger.lifecycle(">>> SLED: yandexMapkitApiKey prefix = ${keyPrefix}...")

android {
    namespace "com.example.sled"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.example.sled"
        minSdk 26
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
        manifestPlaceholders["yandexMapkitApiKey"] = yandexMapkitApiKey
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = "21" }

    signingConfigs {
        release {
            // TODO: перед публикацией в стор указать production keystore.
            // Пока используем ЗАФИКСИРОВАННЫЙ debug.keystore из репозитория
            // (android/debug.keystore) — стабильная подпись между CI-сборками,
            // APK ставится поверх старой версии без удаления.
            storeFile rootProject.file('debug.keystore')
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }
}

flutter { source "../.." }

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
    // Required to call MapKitFactory from MainApplication (yandex_mapkit 4.2.1 wraps 4.22.0-full)
    implementation "com.yandex.android:maps.mobile:4.22.0-full"
}
