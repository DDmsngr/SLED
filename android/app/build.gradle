plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'
// Ключ Yandex MapKit больше не читается тут — он передаётся напрямую в Dart
// через --dart-define=YANDEX_MAPKIT_API_KEY=... (см. .github/workflows/flutter_ci.yml
// и lib/main.dart). Раньше нужно было прокидывать через manifestPlaceholder
// для meta-data в AndroidManifest, но новый плагин yandex_maps_mapkit
// инициализируется из Dart.

android {
    namespace "com.example.sled"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.example.sled"
        minSdk 26
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = "21" }

    signingConfigs {
        release {
            // TODO: перед публикацией в стор указать production keystore.
            // Пока используем ЗАФИКСИРОВАННЫЙ debug.keystore из репозитория
            // (android/debug.keystore) — стабильная подпись между CI-сборками,
            // APK ставится поверх старой версии без удаления.
            storeFile rootProject.file('debug.keystore')
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.release
            // ДИАГНОСТИКА КАРТ: временно отключаем R8/shrink на случай,
            // если ProGuard режет нативный класс MapKit несмотря на -keep правила.
            // TODO: вернуть true после подтверждения что тайлы грузятся.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }
}

flutter { source "../.." }

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
    // Native Yandex MapKit SDK подтягивается автоматически транзитивно
    // через Flutter-плагин yandex_maps_mapkit. Раньше нужно было явно указывать
    // com.yandex.android:maps.mobile:4.22.0-full, потому что старый плагин
    // yandex_mapkit не декларировал зависимость.
}
