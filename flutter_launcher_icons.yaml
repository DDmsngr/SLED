flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/sled_logo.png"

  # Адаптивная иконка Android 8.0+ (API 26+):
  # foreground — сам логотип (должен содержать 25% отступ от краёв)
  # background — заливка за логотипом
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/sled_logo.png"

  min_sdk_android: 21  # Android 5.0+
